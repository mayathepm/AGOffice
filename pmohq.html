    a.forEach(function(s,i){\n      var u=s.querySelector('.sc.up'), d=s.querySelector('.sc.dn');\n      if(u) u.disabled=(i===0);\n      if(d) d.disabled=(i===a.length-1);\n      // heading numbers are derived from position, so moving, adding or\n      // deleting a section never leaves the numbering stale\n      var h=s.querySelector('h2');\n      if(h){\n        var cur=(h.innerText!==undefined?h.innerText:h.textContent).replace(/ /g,' ').trim();\n        // strip EVERY leading "n." group, not just one -- the generator already\n        // emits one and older saves may carry more, so a single strip compounds\n        var bare=cur.replace(/^(?:\\s*\\d+\\.\\s*)+/,'');\n        var want=(i+1)+'. '+bare;\n        if(cur!==want && document.activeElement!==h) h.textContent=want;\n      }\n    });\n  }\n  function cell(tag){\n    var e=document.createElement(tag);\n    e.className='fill'; e.contentEditable='true'; e.spellcheck=false;\n    return e;\n  }\n  function addRow(btn){\n    var sec=btn.closest('.sec'), t=sec.querySelector('table[data-cols]');\n    if(!t) return;\n\n    if (t.hasAttribute('data-calc-table')) {\n      // Calc-aware row: clone the LAST existing data row's structure (which\n      // already carries the correct data-field/data-numeric/data-calc\n      // attributes per column) instead of building generic blank cells --\n      // the generic path below has no idea a cell needs data-numeric to\n      // participate in the calculation engine, which was the actual bug:\n      // rows added via this button were structurally invisible to\n      // recalcTable()/recalcReserves() (see calc engine functions), so\n      // their numbers could never contribute to any total.\n      var existingRows = t.querySelectorAll('tbody tr:not(.calc-foot)');\n      var templateRow = existingRows[existingRows.length - 1];\n      if (!templateRow) return; // no row to clone structure from -- shouldn't happen, calc tables always seed at least one row\n      var newIndex = existingRows.length; // next 0-based row index, matches the -0/-1/-2... suffix pattern in data-field names\n      var newTr = document.createElement('tr');\n      Array.prototype.forEach.call(templateRow.children, function(td){\n        if (td.classList.contains('del-cell')) return; // handled separately below\n        var newTd = document.createElement('td');\n        newTd.className = td.className;\n        newTd.setAttribute('contenteditable', td.getAttribute('contenteditable'));\n        newTd.spellcheck = false;\n        if (td.hasAttribute('data-field')) {\n          // Rename e.g. "labor-2" -> "labor-<newIndex>" so this new row's\n          // fields don't collide with the template row's own field names.\n          var oldField = td.getAttribute('data-field');\n          var base = oldField.replace(/-[0-9]+$/, '');\n          newTd.setAttribute('data-field', base + '-' + newIndex);\n        }\n        if (td.hasAttribute('data-numeric')) newTd.setAttribute('data-numeric', '1');\n        if (td.hasAttribute('data-calc')) {\n          newTd.setAttribute('data-calc', td.getAttribute('data-calc'));\n          newTd.setAttribute('data-row', String(newIndex));\n        }\n        // Blank starting value for numeric/plain cells; calc cells (row\n        // totals) start at $0.00 same as generation time, recalculated\n        // the moment any numeric cell in this row gets a real value.\n        newTd.textContent = td.hasAttribute('data-calc') ? '$0.00' : (td.hasAttribute('data-numeric') ? '$0.00' : '');\n        newTr.appendChild(newTd);\n      });\n      var newDc=document.createElement('td'); newDc.className='del-cell';\n      var newDb=document.createElement('button'); newDb.className='del-row';\n      newDb.setAttribute('data-act','delrow'); newDb.title='Remove row'; newDb.textContent='✕';\n      newDc.appendChild(newDb); newTr.appendChild(newDc);\n      // Insert BEFORE the footer row (calc-foot), not at the very end --\n      // otherwise a new row would render below the Totals row instead of\n      // among the data rows.\n      var footRow = t.querySelector('tr.calc-foot');\n      if (footRow) footRow.parentNode.insertBefore(newTr, footRow); else t.querySelector('tbody').appendChild(newTr);\n      var firstFillable = newTr.querySelector('td.fill');\n      if (firstFillable) firstFillable.focus();\n      runAllCalcs(); // re-run immediately so the new row's $0.00 cells are consistent with the rest of the table\n      return;\n    }\n\n    // Generic path (unchanged): every non-calc table, exactly as before.\n    var n=parseInt(t.getAttribute('data-cols'),10) || (t.querySelectorAll('thead th').length-1);\n    var tb=t.querySelector('tbody'), tr=document.createElement('tr');\n    for(var i=0;i<n;i++) tr.appendChild(cell('td'));\n    var dc=document.createElement('td'); dc.className='del-cell';\n    var db=document.createElement('button'); db.className='del-row';\n    db.setAttribute('data-act','delrow'); db.title='Remove row'; db.textContent='✕';\n    dc.appendChild(db); tr.appendChild(dc); tb.appendChild(tr);\n    var f=tr.querySelector('td.fill'); if(f) f.focus();\n  }\n  function addListItem(btn){\n    var list=btn.closest('.sec').querySelector('ul.fill-list');\n    if(!list) return;\n    var li=document.createElement('li'); li.className='list-item';\n    var span=cell('span');\n    var db=document.createElement('button'); db.className='del-row del-li';\n    db.setAttribute('data-act','delli'); db.title='Remove item'; db.textContent='✕';\n    li.appendChild(span); li.appendChild(db);\n    list.appendChild(li);\n    span.focus();\n  }\n  function addCol(btn){\n    var sec=btn.closest('.sec'), t=sec.querySelector('table[data-cols]');\n    if(!t) return;\n    var isCalc = t.hasAttribute('data-calc-table');\n    var n=parseInt(t.getAttribute('data-cols'),10)+1;\n    t.setAttribute('data-cols',n);\n    var htr=t.querySelector('thead tr');\n    var delTh = htr.querySelector('th.del-cell');\n\n    if (isCalc) {\n      // Find th ppendChild(td);\n    });\n    th.focus();\n  }\n  function delCol(btn){\n    // Deletes the column this button's header belongs to -- fills the real\n    // gap where only rows, never columns, could be removed, which meant\n    // fixing a wrong/unwanted column meant starting the whole table over.\n    // Works generically by COLUMN INDEX POSITION, not by field name, so it\n    // correctly handles both calc and plain tables, and both originally-\n    // generated columns and ones added later via addCol.\n    var th = btn.closest('th');\n    var table = btn.closest('table');\n    if (!th || !table) return;\n    var headerCells = Array.prototype.slice.call(table.querySelectorAll('thead th'));\n    var idx = headerCells.indexOf(th);\n    if (idx < 0) return;\n    if (headerCells.filter(function(h){ return !h.classList.contains('do-not-count'); }).length <= 2) {\n      // headerCells always includes the trailing del-cell th, so 2 remaining\n      // means exactly 1 real column left -- refuse to delete the last one,\n      // a table needs at least one real column to mean anything.\n      window.alert('This table needs at least one column.');\n      return;\n    }\n    th.remove();\n    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function(tr){\n      var cells = tr.querySelectorAll('td');\n      if (cells[idx]) cells[idx].remove();\n    });\n    var n = Math.max(1, parseInt(table.getAttribute('data-cols'), 10) - 1);\n    table.setAttribute('data-cols', n);\n    if (table.hasAttribute('data-calc-table')) runAllCalcs(); // remaining columns' totals must be recomputed without the deleted one\n  }\n  function moveSec(btn,dir){\n    var s=btn.closest('.sec');\n    var t=(dir<0)?s.previousElementSibling:s.nextElementSibling;\n    if(!t || !t.classList.contains('sec')) return;\n    if(dir<0) s.parentNode.insertBefore(s,t);\n    else      s.parentNode.insertBefore(t,s);\n    sync();\n  }\n  function delSec(btn){\n    var s=btn.closest('.sec');\n    if(!window.confirm('Delete this section? This cannot be undone.')) return;\n    s.remove(); sync();\n  }\n  function addSec(type){\n    var anchor=document.getElementById('addTextSec');\n    if(!anchor) return;\n    var d=document.createElement('div'); d.className='sec';\n\n    var ctl=document.createElement('div'); ctl.className='sec-ctl';\n    [['up','▲','Move section up'],['dn','▼','Move section down'],['rm','✕','Delete section']]\n      .forEach(function(x){\n        var b=document.createElement('button');\n        b.className='sc '+x[0]; b.setAttribute('data-act',x[0]);\n        b.title=x[2]; b.textContent=x[1];\n        ctl.appendChild(b);\n      });\n    d.appendChild(ctl);\n\n    var h=cell('h2'); h.textContent='New Section';\n    d.appendChild(h);\n\n    if(type==='table'){\n      var n=3;\n      var t=document.createElement('table'); t.setAttribute('data-cols',n);\n      var thead=document.createElement('thead'), htr=document.createElement('tr');\n      for(var i=0;i<n;i++){ var th=cell('th'); th.textContent='Column'; htr.appendChild(th); }\n      var hd=document.createElement('th'); hd.className='del-cell'; htr.appendChild(hd);\n      thead.appendChild(htr); t.appendChild(thead);\n\n      var tb=document.createElement('tbody'), tr=document.createElement('tr');\n      for(var j=0;j<n;j++) tr.appendChild(cell('td'));\n      var dc=document.createElement('td'); dc.className='del-cell';\n      var db=document.createElement('button'); db.className='del-row';\n      db.setAttribute('data-act','delrow'); db.title='Remove row'; db.textContent='✕';\n      dc.appendChild(db); tr.appendChild(dc); tb.appendChild(tr); t.appendChild(tb);\n      d.appendChild(t);\n\n      var ab=document.createElement('button'); ab.className='add-row';\n      ab.setAttribute('data-act','addrow'); ab.textContent='+ Add row';\n      d.appendChild(ab);\n      var cb=document.createElement('button'); cb.className='add-row add-col';\n      cb.setAttribute('data-act','addcol'); cb.textContent='+ Add \n      return chain;\n    }).then(function(text){\n      var m=text.match(new RegExp(MARK+'([A-Za-z0-9+/=\\\\s]*?)'+MARK));\n      if(!m){ var e1=new Error('No structure layer detected'); e1.code='NO_LAYER'; throw e1; }\n      var d=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\\s/g,'')))));\n      if(d.format!=='mypmo.document'){ var e2=new Error('Unrecognized document format'); e2.code='NO_LAYER'; throw e2; }\n      return d;\n    });\n  }\n\n  function openGate(d){\n    var t=d.sections.filter(function(s){return s.type==='text';}).length;\n    var tb=d.sections.filter(function(s){return s.type==='table';}).length;\n    var rows=d.sections.reduce(function(n,s){ return n+((s.rows&&s.rows.length)||0); },0);\n    document.getElementById('gateBody').innerHTML=\n      'Read the following structure from the uploaded PDF. Nothing is applied until you approve.'+\n      '<ul><li><b>'+d.sections.length+' sections</b> \\u2014 '+t+' text, '+tb+' table</li>'+\n      '<li><b>'+rows+' table rows</b> across all tables</li>'+\n      '<li>Order: '+d.sections.map(function(s){return s.h;}).join(' \\u2192 ')+'</li>'+\n      '<li>Saved '+new Date(d.savedAt).toLocaleString()+'</li></ul>';\n    pending=d;\n    document.getElementById('gate').style.display='block';\n    document.getElementById('gate').scrollIntoView({behavior:'smooth',block:'center'});\n  }\n  function applyGate(){\n    if(pending) render(pending);\n    var rb=document.getElementById('restoreBanner');\n    if(rb) rb.style.display='none';\n    closeGate();\n  }\n  function closeGate(){ document.getElementById('gate').style.display='none'; pending=null; }\n\n  // Delegated so it works regardless of when <body> parses -- binding directly\n  // to #pdfIn at script-run time fails because this script is in <head>.\n  document.addEventListener('change',function(e){\n    if(!e.target || e.target.id!=='pdfIn') return;\n    var f=e.target.files && e.target.files[0]; if(!f) return;\n    e.target.value='';\n    hideRestoreError();\n    if(!window.pdfjsLib){ alert('PDF reader is still loading. Give it a moment and try again.'); return; }\n    f.arrayBuffer().then(readPdf).then(openGate).catch(function(err){\n      if(err && err.code==='NO_LAYER'){\n        // The file is fine -- it simply isn't a native export, so there is no\n        // structure layer to rebuild the editable artifact from. Shown in-page\n        // rather than via alert() so the migration FAQ can be linked.\n        showRestoreError(\n          'Unable to restore this PDF as an editable PMOHQ artifact.',\n          '<p>This PDF does not contain the required document structure layer. Only PDFs '+\n          'exported directly from PMOHQ can be restored with full sections, tables, '+\n          'ordering, and controls preserved.</p>'+\n          '<p>If this PDF was created using the browser print dialog or exported before the '+\n          'restoration feature was available, it will not be compatible with Restore from PDF.</p>'+\n          '<p><a href="'+FAQ_URL+'" target="_blank" rel="noopener">How do I migrate an existing '+\n          'document into PMOHQ?</a></p>',\n          'No structure layer detected');\n      } else {\n        // Genuine read failure -- do not tell them it is a print-dialog PDF.\n        showRestoreError(\n          'Unable to read this file.',\n          '<p>The file could not be opened as a PDF. It may be damaged, still downloading, '+\n          'or not a PDF at all. Try selecting the file again.</p>',\n          (err && err.message ? err.message : 'Unknown read error'));\n      }\n    });\n  });\n\n  /* ===================== END ROUND-TRIP ENGINE ===================== */\n\n  /* ===================== CALCULATION ENGINE (Scope A) =====================\n     Feasibility note (kept in the generated file deliberately, not just in\n     chat): this operates ONLY on data already present in THIS document's own\n     DOM. It has no access to other documents, other projects, or anything\n     outside this single generated HTML file -- there is no live connection\n     back to PMOHQ here. Real cross-document sourcing (pulling a number\n     from Cost Management Plan into this Budget) needs to happen at\n     generation time inside the app, before this HTML is even created, or\n     via a future read of two documents' live in-app state -- not by this\n     script reaching outside itself, which a static generated file\n     structurally cannot do. */\n  function cellTextPM(el){\n    if(!el) return '';\n    // innerText is layout-dependent and can be inconsistent (some\n    // environments/edge cases return undefined or empty even when the cell\n    // has real content); textContent is the reliable fallback everywhere.\n    var t = el.innerText;\n    if(t==null || t==='') t = el.textContent;\n    return t || '';\n  }\n  function parseMoneyPM(raw){\n    if(raw==null) return 0;\n    var s=String(raw).replace(/[^0-9.\\-]/g,'');\n    var n=parseFloat(s);\n    return isNaN(n) ? 0 : n;\n  }\n  function fmtMoneyPM(n){\n    var sign = n<0 ? '-' : '';\n    return sign+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});\n  }\n  function recalcTable(table){\n    // Dynamically discover every numeric field base name present (e.g.\n    // "labor", "materials", "travel" if a column named Travel was added)\n    // instead of four hardcoded names -- this is what makes newly added\n    // columns actually participate in the math, and what keeps the totals\n    // correct after a column is deleted (see delCol below), since neither\n    // operation has to also touch this function by hand.\n    var fieldTotals = {}; // { baseName: runningTotal }\n    var grandTotal = 0;\n    Array.prototype.forEach.call(table.querySelectorAll('tbody tr:not(.calc-foot)'), function(tr){\n      var rowTotal = 0;\n      Array.prototype.forEach.call(tr.querySelectorAll('[data-numeric]'), function(cell){\n        var field = cell.getAttribute('data-field') || '';\n        var base = field.replace(/-[0-9]+$/, '') || 'value';\n        var v = parseMoneyPM(cellTextPM(cell));\n        fieldTotals[base] = (fieldTotals[base] || 0) + v;\n        rowTotal += v;\n      });\n      grandTotal += rowTotal;\n      var rowCell = tr.querySelector('[data-calc="row-total"]');\n      if(rowCell) rowCell.textContent = fmtMoneyPM(rowTotal);\n    });\n    var footRow = table.querySelector('tr.calc-foot');\n    if(footRow){\n      Object.keys(fieldTotals).forEach(function(base){\n        var c = footRow.querySelector('[data-calc="'+base+'-total"]');\n        if(c) c.textContent = fmtMoneyPM(fieldTotals[base]);\n      });\n      var grandCell = footRow.querySelector('[data-calc="grand-total"]');\n      if(grandCell) grandCell.textContent = fmtMoneyPM(grandTotal);\n    }\n    return grandTotal;\n  }\n  function recalcReserves(){\n    var estTable = document.querySelector('table[data-calc-table="1"]');\n    if(!estTable) return;\n    var estimateTotal = recalcTable(estTable);\n\n    var reserveSec = Array.prototype.filter.call(secs(), function(s){ return s.querySelector('table[data-reserve-table]'); })[0];\n    if(!reserveSec) return;\n    var rTable = reserveSec.querySelector('table[data-reserve-table]');\n    var contingencyPctCell = rTable.querySelector('[data-field="contingency-pct"]');\n    var mgmtPctCell = rTable.querySelector('[data-field="mgmt-pct"]');\n    var contingencyPct = contingencyPctCell ? parseFloat(String(cellTextPM(contingencyPctCell)).replace(/[^0-9.]/g,'')) || 0 : 0;\n    var contingencyAmt = estimateTotal * (contingencyPct/100);\n    var contingencyCell = rTable.querySelector('[data-calc="contingency-amt"]');\n    if(contingencyCell) contingencyCell.textContent = fmtMoneyPM(contingencyAmt);\n\n    var mgmtPct = mgmtPctCell ? parseFloat(String(cellTextPM(mgmtPctCell)).replace(/[^0-9.]/g,'')) || 0 : 0;\n    var mgmtBase = estimateTotal + contingencyAmt;\n    var mgmtAmt = mgmtBase * (mgmtPct/100);\n    var mgmtCell = rTable.querySelector('[data-calc="mgmt-amt"]');\n    if(mgmtCell) mgmtCell.textContent = fmtMoneyPM(mgmtAmt);\n\n    var totalBudget = estimateTotal + contingencyAmt + mgmtAmt;\n    var totalCell = document.querySelector('[data-calc="total-project-budget"]');\n    if(totalCell) totalCell.textContent = fmtMoneyPM(totalBudget);\n  }\n  function runAllCalcs(){\n    Array.prototype.forEach.call(document.querySelectorAll('table[data-calc-table="1"]'), recalcTable);\n    recalcReserves();\n  }\n  function triggerCalcIfNumericCell(ev){\n    var el = ev.target;\n    if(el && el.getAttribute && (el.hasAttribute('data-numeric') || el.hasAttribute('data-field'))) {\n      runAllCalcs();\n    }\n  }\n  // Listen on multiple real event types, not just 'input' -- contenteditable\n  // elements have known cross-browser inconsistencies in exactly which\n  // event fires for a given edit (some rely on keyup, some on\n  // compositionend for IME/paste-style input, not every browser fires\n  // 'input' reliably for every contenteditable edit path). Redundant\n  // firing is harmless since runAllCalcs() just recomputes from current\n  // DOM state each time; missing a real edit because only one event type\n  // was covered is the actual risk this removes.\n  document.addEventListener('input', triggerCalcIfNumericCell);\n  document.addEventListener('keyup', triggerCalcIfNumericCell);\n  document.addEventListener('paste', function(ev){ setTimeout(function(){ triggerCalcIfNumericCell(ev); }, 0); });\n  document.addEventListener('blur', function(ev){\n    // Reformat as currency once the person leaves a numeric cell, so typing\n    // "1500" while focused doesn't fight the $ formatting mid-keystroke.\n    var el = ev.target;\n    if(el && el.getAttribute && el.hasAttribute('data-numeric') && el.closest('[data-field]')){\n      var n = parseMoneyPM(cellTextPM(el));\n      if(!el.getAttribute('data-field') || el.getAttribute('data-field').indexOf('pct')===-1) el.textContent = fmtMoneyPM(n);\n    }\n  }, true);\n  /* ===================== END CALCULATION ENGINE ===================== */\n\n  document.addEventListener('click', function(ev){\n    var b=ev.target.closest('button'); if(!b) return;\n    if(b.id==='savePdf'){ exportPdf(); return; }\n    if(b.id==='reClose'){ hideRestoreError(); return; }\n    if(b.id==='pdfBack'){ closePdfPreview(); return; }\n    if(b.id==='pdfDl'){ downloadCurrentPdf(); return; }\n    if(b.id==='openPdf'){ document.getElementById('pdfIn').click(); return; }\n    if(b.id==='gateOk'){ applyGate(); return; }\n    if(b.id==='gateNo'){ closeGate(); return; }\n    if(b.id==='addTextSec'){ addSec('text'); return; }\n    if(b.id==='addTableSec'){ addSec('table'); return; }\n    var a=b.getAttribute('data-act'); if(!a) return;\n    if(a==='up')     moveSec(b,-1);\n    else if(a==='dn')moveSec(b,1);\n    else if(a==='rm')delSec(b);\n    else if(a==='addrow') addRow(b);\n    else if(a==='addcol') addCol(b);\n    else if(a==='delcol') delCol(b);\n    else if(a==='addlistitem') addListItem(b);\n    else if(a==='delrow' || a==='delli'){ var row=b.closest('tr')||b.closest('li'); if(row) row.remove(); }\n  });\n\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ sync(); runAllCalcs(); });\n  else { sync(); runAllCalcs(); }\n\n  // When opened via "Restore from PDF" in the app, prompt for the exported PDF\n  // straight away rather than making the person hunt for the toolbar button.\n  if(${o?"true":"false"}){\n    var kick=function(){\n      var banner=document.getElementById('restoreBanner');\n      if(banner) banner.style.display='block';\n      var el=document.getElementById('pdfIn');\n      if(el) el.click();\n    };\n    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick);\n    else setTimeout(kick,60);\n  }\n})();\n<\/script>\n</head><body>\n<div class="toolbar"><div><strong><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:2px"><path d="M12 20h9" stroke="${i}" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="${i}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Editable artifact</strong> <span>— click any field to edit or input details · add or remove rows, columns, text sections &amp; table sections · save as PDF · return to the workflow workspace to restore your PDF back to an HTML for editing</span></div> <button onclick="window.history.back()" class="ghost" style="white-space:nowrap;margin-left:8px;">← Back</button> <input type="file" id="pdfIn" accept="application/pdf" style="display:none"> ${o?'<button id="openPdf" class="ghost">↺ Reopen from PDF</button> ':""}<button id="savePdf">Save as PDF</button></div>\n<div id="restoreBanner" class="restore-banner" style="display:none">Choose a PMOHQ PDF to restore. If the picker didn’t open, tap <strong>↺ Reopen from PDF</strong> above.</div>\n<div id="restoreError" class="restore-error" style="display:none"></div>\n<div id="gate" class="gate" style="display:none"><div class="gate-h">Version Control Gate · Review before restore</div><div class="gate-b" id="gateBody"></div><div class="gate-a"><button id="gateOk">Approve &amp; restore</button> <button id="gateNo" class="ghost">Discard</button></div></div>\n<div class="badge">${escapeHtmlPM(e.badgeOverride||`${r} · ${n||""}`)}</div>\n<h1>${escapeHtmlPM(e.name)}</h1>\n${e.descOverride||pmResolveDocDesc(e.id,t?.workflow)?`<p class="subtitle">${escapeHtmlPM(e.descOverride||pmResolveDocDesc(e.id,t?.workflow))}</p>`:""}\n<table class="meta"><tbody>\n${(e.metaOverride||[["Workflow",r],["Stage",n||""],["Project Name",t?.name||"Click to fill in…"],["Owner",pmResolveDocOwner(e.id,t?.workflow)||t?.pm||"Click to fill in…"],["Date",l],["Version","1.0"]]).map(([e,t])=>`<tr><td class="ml">${escapeHtmlPM(e)}</td><td class="fill" contenteditable="true" spellcheck="false">${escapeHtmlPM(t)}</td></tr>`).join("")}\n</tbody></table>\n${d}\n<button class="add-sec" id="addTextSec">+ Add text section</button>\n<button class="add-sec" id="addTableSec">+ Add table section</button>\n<div style="margin-top:48px;padding-top:16px;border-top:1px solid #E5E4DF;text-align:center;font-size:11px;color:#8B8A82">© 2026 PMOHQ™. All rights reserved. www.thePMOHQ.com</div>\n</body></html>`}function escapeHtmlPM(e){return String(e||"").replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[e]))}function pmLinkedBudgetSection(e,t){const n=`Pulled from the project's Project Budget (extracted ${new Date(t.extractedAt).toLocaleDateString()}). This is a snapshot at the time this document was generated, not a live link -- if the Budget changes later, regenerate this document to pick up the new figures.`;return"funding"===e?{h:"Funding Requirement (Linked from Project Budget)",kv:[["Base Estimate",money(t.grandTotal)],["Contingency Reserve",money(t.contingencyAmt)],["Management Reserve",money(t.mgmtAmt)],["Total Funding Required",money(t.totalProjectBudget)],["Source",n]]}:{h:"Linked Financial Data (from Project Budget)",kv:[["Cost Estimate (Grand Total)",money(t.grandTotal)],["Contingency Reserve Amount",money(t.contingencyAmt)],["Management Reserve Amount",money(t.mgmtAmt)],["Total Project Budget",money(t.totalProjectBudget)],["Source",n]]}}function pmResolveTemplateSections(e,t){return PM_TEMPLATE_SECTIONS[`${t}:${e}`]||PM_TEMPLATE_SECTIONS[e]||PM_TEMPLATE_SECTIONS.__default}function pmResolveDocOwner(e,t){return PM_DOC_OWNERS[`${t}:${e}`]||""}function pmResolveDocDesc(e,t){return PM_DOC_DESCS[`${t}:${e}`]||""}const PM_DOC_DESCS={"agile:backlog":"Living backlog starting as Initial Product Backlog, continuously refined.","agile:backlog_u":"Backlog refinement / grooming updates.","agile:ben":"How and when benefits are derived, owned, and measured.","agile:bnd":"High-level deliverables and needs of the project to be analyzed.","agile:capa":"Improvement actions identified in retrospe
