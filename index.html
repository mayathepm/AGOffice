<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGOffice + PMOHQ — One Way In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1E4FA0;--plus:clamp(52px,7.5vmin,92px);--edge:clamp(24px,6vmin,80px);--gap:clamp(16px,3.6vh,42px);--kick:46px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#121211;overflow:hidden}
body{font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

.stage{display:flex;flex-direction:column;height:100vh;height:100dvh}
.doors{position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;transition:grid-template-columns .9s cubic-bezier(.2,.8,.2,1),grid-template-rows .9s cubic-bezier(.2,.8,.2,1)}

/* ---------- Doors ---------- */
.door{position:relative;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--gap);
  padding:var(--edge);transition:background .5s ease,filter .6s ease,opacity .5s ease}
.ago{background:#F7F6F2;color:#151513;--muted:#8A8880;--rule:rgba(21,21,19,.3);padding-right:calc(var(--edge) + var(--plus)/2)}
.hq{background:#121211;color:#F3F1EA;--muted:#7C7A72;--rule:rgba(243,241,234,.3);padding-left:calc(var(--edge) + var(--plus)/2)}
.ago:hover{background:#F0EEE8}.hq:hover{background:#181817}
.door:focus-visible{outline:1px solid currentColor;outline-offset:-10px}

.eyebrow{font-size:clamp(10px,1.5vh,12px);font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding-left:.3em}
.body{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px)}
.body::after{content:"";order:3;width:28px;height:1px;background:var(--rule);margin-top:clamp(8px,2vh,22px)}
.wordmark{position:relative;display:flex;align-items:baseline;font-family:'Poppins',sans-serif;font-weight:500;line-height:1;letter-spacing:-.035em;font-size:clamp(34px,min(6.4vw,13vh),96px)}
.wordmark .dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--blue);margin:0 .04em 0 .05em}
.hq .wordmark .dot{background:#5B8DE0}
.wordmark sup{position:absolute;left:100%;top:0;margin-left:.12em;font-size:.16em;font-weight:400;letter-spacing:0;margin-top:.5em;color:var(--muted)}
.tagline{font-weight:300;font-size:clamp(14px,min(1.7vw,2.9vh),22px);line-height:1.4;margin:0;text-wrap:balance}
.hq .tagline{color:#B9B6AD}
.enter{position:relative;display:inline-flex;align-items:center;font-size:clamp(10px,1.5vh,12px);font-weight:500;letter-spacing:.28em;text-transform:uppercase;padding-left:.28em}
.enter .arr{position:absolute;left:100%;margin-left:10px;transition:transform .35s ease}
.door:hover .enter .arr,.door:focus-visible .enter .arr{transform:translateX(6px)}

/* pen underline */
.tl{position:relative;display:inline-block;white-space:nowrap;padding-bottom:.62em}
.tl-pen{position:absolute;left:0;bottom:0;width:100%;height:.62em;overflow:visible;transform:scaleY(-1);pointer-events:none;opacity:0;transition:opacity .35s ease}
.tl-pen path:not(.m){fill:#1E4FA0}.hq .tl-pen path:not(.m){fill:#7FA6F0}
.tl-pen .m{stroke:#fff;stroke-width:20;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
@keyframes tlDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.door:hover .tl-pen,.door:focus-visible .tl-pen,.door:active .tl-pen,.door.ul .tl-pen{opacity:1}
.door:hover .tl-pen .m,.door:focus-visible .tl-pen .m,.door:active .tl-pen .m,.door.ul .tl-pen .m{animation:tlDraw .9s cubic-bezier(.55,.1,.25,1) forwards}

/* ---------- The + ---------- */
.plus{position:absolute;z-index:5;left:50%;top:50%;width:var(--plus);height:var(--plus);margin:calc(var(--plus)/-2) 0 0 calc(var(--plus)/-2);border-radius:50%;background:var(--blue);pointer-events:none;
  box-shadow:0 0 0 6px rgba(127,127,127,.12);transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;background:#FAF9F5;border-radius:1px}
.plus::before{width:34%;height:2px;margin:-1px 0 0 -17%}
.plus::after{width:2px;height:34%;margin:-17% 0 0 -1px}
.doors:has(.door:hover) .plus{transform:rotate(90deg)}

/* ---------- Bottom line ---------- */
.kicker{flex:0 0 auto;min-height:var(--kick);display:flex;align-items:center;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;background:#121211;color:#F3F1EA;border-top:1px solid rgba(243,241,234,.14);
  font-size:clamp(9px,1.4vh,11px);font-weight:500;letter-spacing:.26em;text-transform:uppercase;padding-left:calc(16px + .26em)}

/* ---------- Hover: that side opens up a little (wide screens) ---------- */
@media (hover:hover) and (min-aspect-ratio:1/1){
  .doors:has(.ago:hover,.ago:focus-visible){grid-template-columns:1.3fr 1fr}
  .doors:has(.hq:hover,.hq:focus-visible){grid-template-columns:1fr 1.3fr}
  .doors:has(.ago:hover,.ago:focus-visible) .plus{left:56.52%}
  .doors:has(.hq:hover,.hq:focus-visible) .plus{left:43.48%}
}

/* ---------- Tall / narrow screens: stack top and bottom ---------- */
@media (max-aspect-ratio:1/1){
  .doors{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .ago{padding:var(--edge) var(--edge) calc(var(--edge)*.6 + var(--plus)/2)}
  .hq{padding:calc(var(--edge)*.6 + var(--plus)/2) var(--edge) var(--edge)}
  .wordmark{font-size:clamp(34px,min(14vw,7.4vh),84px)}
  .tagline{font-size:clamp(14px,min(4.2vw,2.4vh),20px)}
  .doors.press-ago{grid-template-rows:1.25fr 1fr}.doors.press-hq{grid-template-rows:1fr 1.25fr}
  .doors.press-ago .plus{top:55.55%}.doors.press-hq .plus{top:44.45%}
}
/* ---------- Short wide screens (phones on their side, shallow windows) ---------- */
@media (min-aspect-ratio:1/1) and (max-height:520px){
  :root{--kick:34px;--gap:clamp(10px,3vh,18px)}
  .wordmark{font-size:clamp(28px,min(5.4vw,15vh),64px)}
  .body::after{display:none}
  .tagline{font-size:clamp(12px,3.4vh,16px)}
  .eyebrow,.enter{font-size:10px}
}
/* very wide screens: keep the lockup from floating too far apart */
@media (min-width:1700px) and (min-aspect-ratio:1/1){ .door{padding-left:max(var(--edge),8vw)} .ago{padding-left:max(var(--edge),8vw);padding-right:calc(var(--edge) + var(--plus)/2)} .hq{padding-left:calc(var(--edge) + var(--plus)/2)} }

@media (max-width:480px){.kicker{letter-spacing:.14em;font-size:9.5px;padding-left:calc(12px + .14em);padding-right:12px}}
/* ---------- Background texture: drifting light, fine lines, film grain ---------- */
.door>*{position:relative;z-index:2}
.door::before{content:"";position:absolute;z-index:0;width:90vmax;height:90vmax;left:50%;top:50%;margin:-45vmax 0 0 -45vmax;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.ago::before{background:radial-gradient(closest-side,rgba(31,79,160,.16),rgba(31,79,160,0) 70%)}
.hq::before{background:radial-gradient(closest-side,rgba(60,116,224,.30),rgba(60,116,224,0) 70%);animation-duration:26s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate3d(-14%,-10%,0) scale(1)}to{transform:translate3d(14%,12%,0) scale(1.15)}}
.door::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.06;
  background-image:linear-gradient(to right,currentColor 1px,transparent 1px);background-size:12.5% 100%;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.doors::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.16;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
/* ---------- The Platform: bold ---------- */
.hq .eyebrow{color:#7FA6F0;font-weight:700;letter-spacing:.3em}
.hq .wordmark{font-weight:700;letter-spacing:-.02em}
.hq .wordmark .dot{background:#1E4FA0;width:.1945em;height:.1945em}
.hq .tagline{font-family:'Poppins',sans-serif;font-weight:600;color:#F3F1EA;opacity:.92;font-size:clamp(15px,min(1.9vw,3.2vh),26px)}
.hq .enter{font-weight:700;letter-spacing:.3em}
.hq .body::after{height:1px;width:36px;background:#7FA6F0;opacity:.7}
.hq::before{background:radial-gradient(closest-side,rgba(60,116,224,.38),rgba(60,116,224,0) 70%)}
@media (max-aspect-ratio:1/1){.hq .tagline{font-size:clamp(15px,min(4.6vw,2.6vh),22px)}}
/* ---------- The Practice: Poppins, as originally ---------- */
.ago .wordmark{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-.02em}
.ago .wordmark .dot{width:.216em;height:.216em}
.ago .tagline{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(15px,min(1.9vw,3.2vh),26px);color:#151513;opacity:.88}
@media (max-aspect-ratio:1/1){.ago .tagline{font-size:clamp(15px,min(4.6vw,2.6vh),22px)}}
/* ---------- The Practice label in blue; banner pinned to the top on tall screens ---------- */
.ago .eyebrow{color:#1E4FA0;font-weight:700}
@media (max-aspect-ratio:1/1){
  .kicker{order:-1;border-top:0;border-bottom:1px solid rgba(243,241,234,.14);padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px calc(12px + .14em)}
}
/* The Practice label in brand blue; on tall screens the bottom line becomes the banner at the top */
.ago .eyebrow{color:#1E4FA0;font-weight:700}
@media (max-aspect-ratio:1/1){
  .kicker{order:-1;border-top:0;border-bottom:1px solid rgba(243,241,234,.14);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
}
/* ---------- Motion ---------- */
.door>*{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) backwards}
.ago>:nth-child(1){animation-delay:.35s}.ago>:nth-child(2){animation-delay:.55s}.ago>:nth-child(3){animation-delay:.8s}
.hq>:nth-child(1){animation-delay:.45s}.hq>:nth-child(2){animation-delay:.65s}.hq>:nth-child(3){animation-delay:.9s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.ago{animation:wipeL 1.2s cubic-bezier(.2,.8,.2,1) both}
.hq{animation:wipeR 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes wipeL{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeT{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeB{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (max-aspect-ratio:1/1){.ago{animation-name:wipeT}.hq{animation-name:wipeB}}
.plus{animation:pop 1s .9s cubic-bezier(.2,1.4,.3,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
.kicker{animation:rise 1s 1.3s ease backwards}

/* zoom through on choose */
.doors.go{cursor:progress}
.doors.go-ago{grid-template-columns:6fr 0fr}.doors.go-hq{grid-template-columns:0fr 6fr}
@media (max-aspect-ratio:1/1){.doors.go-ago{grid-template-columns:1fr;grid-template-rows:6fr 0fr}.doors.go-hq{grid-template-columns:1fr;grid-template-rows:0fr 6fr}}
.doors.go-ago .hq,.doors.go-hq .ago{opacity:0}
.doors.go .plus{opacity:0;transform:scale(.4)}
.doors.go ~ .kicker{opacity:0;transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tl-pen .m{stroke-dashoffset:0}}

/* tagline is revealed only when a door is chosen */
.tagline{clip-path:inset(-.3em 100% -1em 0);transition:clip-path .75s cubic-bezier(.65,0,.25,1) .2s}
.doors.go .door.ul .tagline{clip-path:inset(-.3em -4% -1em 0)}
.door:not(.ul):hover .tl-pen,.door:not(.ul):focus-visible .tl-pen,.door:not(.ul):active .tl-pen{opacity:0}
.door:not(.ul):hover .tl-pen .m,.door:not(.ul):focus-visible .tl-pen .m,.door:not(.ul):active .tl-pen .m{animation:none}
.door.ul .tl-pen .m{animation:tlDraw .9s cubic-bezier(.55,.1,.25,1) .6s forwards}

/* wordmark rests at the exact center of its door; chosen door lifts as the tagline arrives */
.door>.eyebrow,.door>.body,.door>.enter{translate:0 var(--lift,0px)}
.doors.go .door>.eyebrow,.doors.go .door>.body,.doors.go .door>.enter{translate:0 0;transition:translate .9s cubic-bezier(.2,.8,.2,1) .15s}

/* stacked (phone) layout: the tagline takes no room until a door is chosen, so Enter clears the + */
@media (max-aspect-ratio:1/1){
 .body{--g:clamp(10px,2vh,22px);gap:var(--g)}
 .tagline{max-height:0;overflow:hidden;margin-top:calc(var(--g) * -1);transition:clip-path .75s cubic-bezier(.65,0,.25,1) .2s,max-height .9s cubic-bezier(.2,.8,.2,1) .15s,margin-top .9s cubic-bezier(.2,.8,.2,1) .15s}
 .doors.go .door.ul .tagline{max-height:2.8em;margin-top:0}
}
</style>
</head>
<body>
<main class="stage">
  <div class="doors">
    <a class="door ago" href="agoffice.html" aria-label="Enter AGOffice">
      <span class="eyebrow">The Practice</span>
      <span class="body"><span class="wordmark">AGOffice<i class="dot"></i><sup>&trade;</sup></span>
      <span class="tagline"><span class="tl">Where your work flows<svg class="tl-pen" viewBox="0 0 184 30" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="pmA" maskUnits="userSpaceOnUse" x="-10" y="-10" width="210" height="60"><path class="m" pathLength="1" d="M2 18 C42 25 112 25 182 6"/></mask></defs><path mask="url(#pmA)" d="M1 17 C38 21 112 22 183 5 C186 4.4 186 6.6 183 7.8 C114 28 38 28 1 17 Z"/></svg></span></span></span>
      <span class="enter">Enter <span class="arr">&rarr;</span></span>
    </a>
    <a class="door hq" href="https://www.thepmohq.com" aria-label="Join the PMOHQ waitlist">
      <span class="eyebrow">The Platform</span>
      <span class="body"><span class="wordmark">PMOHQ<i class="dot"></i><sup>&trade;</sup></span>
      <span class="tagline"><span class="tl">Where your work flows<svg class="tl-pen" viewBox="0 0 184 30" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="pmB" maskUnits="userSpaceOnUse" x="-10" y="-10" width="210" height="60"><path class="m" pathLength="1" d="M2 18 C42 25 112 25 182 6"/></mask></defs><path mask="url(#pmB)" d="M1 17 C38 21 112 22 183 5 C186 4.4 186 6.6 183 7.8 C114 28 38 28 1 17 Z"/></svg></span></span></span>
      <span class="enter">Join the waitlist <span class="arr">&rarr;</span></span>
    </a>
    <div class="plus" aria-hidden="true"></div>
  </div>
  <div class="kicker">Integrated Operations and Project Delivery</div>
</main>
<script>
(function(){var doors=document.querySelector('.doors');if(!doors)return;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function sideOf(el){var d=el.closest('.door');return d&&(d.classList.contains('ago')?'ago':'hq');}
function clear(){doors.classList.remove('press-ago','press-hq');}
doors.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'||doors.classList.contains('go'))return;var s=sideOf(e.target);if(s){clear();doors.classList.add('press-'+s);}},{passive:true});
['pointerup','pointercancel'].forEach(function(t){doors.addEventListener(t,function(){setTimeout(function(){if(!doors.classList.contains('go'))clear();},350);},{passive:true});});
doors.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.door');if(!a||reduce)return;if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();if(doors.classList.contains('go'))return;
var s=sideOf(a);clear();doors.classList.add('go','go-'+s);a.classList.add('ul');
var drawn=a._hoverAt?Math.max(0,900-(performance.now()-a._hoverAt)):900;
setTimeout(function(){location.href=a.href;},2000);});
Array.prototype.forEach.call(doors.querySelectorAll('a.door'),function(a){a.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')a._hoverAt=performance.now();});a.addEventListener('pointerleave',function(){a._hoverAt=0;});});
window.addEventListener('pageshow',function(e){if(e.persisted){doors.classList.remove('go','go-ago','go-hq');clear();}});
})();

(function(){var doors=document.querySelector('.doors');if(!doors)return;
function center(){if(doors.classList.contains('go'))return;
Array.prototype.forEach.call(doors.querySelectorAll('a.door'),function(d){var w=d.querySelector('.wordmark');if(!w)return;
var cur=parseFloat(d.style.getPropertyValue('--lift'))||0;var dr=d.getBoundingClientRect(),wr=w.getBoundingClientRect();var b=d.querySelector('.body'),ty=0;try{ty=new DOMMatrix(getComputedStyle(b).transform).m42||0;}catch(e){}
var lift=cur+((dr.top+dr.height/2)-(wr.top+wr.height/2-ty));d.style.setProperty('--lift',lift.toFixed(2)+'px');});}
center();window.addEventListener('resize',center);window.addEventListener('load',center);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(center);
if(window.ResizeObserver){var ro=new ResizeObserver(center);Array.prototype.forEach.call(doors.querySelectorAll('a.door'),function(d){ro.observe(d);});}
doors.addEventListener('transitionend',center);
doors.addEventListener('animationend',center);[300,900,1800,3000].forEach(function(t){setTimeout(center,t);});
})();
</script>
</body>
</html>
